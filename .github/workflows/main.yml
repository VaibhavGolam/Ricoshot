name: Build Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Each CI run gets a higher versionCode automatically (Play Store needs this).
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.RICOSHOT_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # GitHub's Ubuntu runners already include the Android SDK (ANDROID_HOME is set),
      # and Gradle downloads any missing SDK platform on its own, so no setup step is needed.
      - name: Show Android SDK location
        run: echo "ANDROID_HOME=$ANDROID_HOME"

      # --ignore-scripts skips package.json's postinstall; the next step does its job,
      # so the build works even if tools/copy-vendor.js isn't in the repo.
      - name: Install packages
        run: npm ci --ignore-scripts

      - name: Copy Capacitor bridge into the game
        run: |
          mkdir -p www/vendor
          cp node_modules/@capacitor/core/dist/capacitor.js www/vendor/capacitor.js
          ls -la www www/vendor

      - name: Copy the game into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ricoshot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Signed release builds only run once you add the keystore secrets (see README).
      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.RICOSHOT_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/ricoshot.jks"

      - name: Build signed release APK and AAB
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          RICOSHOT_KEYSTORE_PATH: ${{ runner.temp }}/ricoshot.jks
          RICOSHOT_KEYSTORE_PASSWORD: ${{ secrets.RICOSHOT_KEYSTORE_PASSWORD }}
          RICOSHOT_KEY_ALIAS: ${{ secrets.RICOSHOT_KEY_ALIAS }}
          RICOSHOT_KEY_PASSWORD: ${{ secrets.RICOSHOT_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload release files
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ricoshot-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
