<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04050F">
<title>Ricoshot</title>
<style>
  /* Fonts ship inside the app so it looks the same offline */
  @font-face { font-family: "Bungee"; font-weight: 400; font-display: swap; src: url("fonts/bungee-400.woff2") format("woff2"); }
  @font-face { font-family: "Rubik"; font-weight: 500; font-display: swap; src: url("fonts/rubik-500.woff2") format("woff2"); }
  @font-face { font-family: "Rubik"; font-weight: 700; font-display: swap; src: url("fonts/rubik-700.woff2") format("woff2"); }
  @font-face { font-family: "Rubik"; font-weight: 800; font-display: swap; src: url("fonts/rubik-800.woff2") format("woff2"); }
  /* Ricoshot: one portrait arcade screen, letterboxed. Single dark look on purpose (neon arcade). */
  :root {
    --void: #04050F;
    --void-2: #0B0E27;
    color-scheme: dark;
  }
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    background: radial-gradient(ellipse at 50% 40%, var(--void-2), var(--void) 70%) fixed, var(--void);
  }
  #wrap {
    position: fixed;
    inset: 0;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  canvas {
    display: block;
    touch-action: none;
    outline: none;
    box-shadow: 0 0 0 1px rgba(107, 119, 214, 0.18), 0 30px 80px rgba(0, 0, 0, 0.6);
  }
</style>

</head>
<body>
<div id="wrap"><canvas id="c" tabindex="0" aria-label="Ricoshot game"></canvas></div>

<!-- Capacitor bridge (copied from node_modules by tools/copy-vendor.js). Missing in a plain browser, which is fine. -->
<script src="vendor/capacitor.js"></script>
<script>
(() => {
'use strict';

/* =====================================================================
   CORE  (config, rng, levels, physics, game rules)
   Nothing in here touches the DOM, so it can be tested on its own.
   ===================================================================== */
/*CORE-START*/
const CONFIG = {
  // Screen and grid (logical pixels, portrait 9:16)
  W: 720, H: 1280,
  COLS: 7, ROWS: 10, CELL: 96,
  FIELD_X: 24, FIELD_Y: 132,

  // Balls
  BALL_R: 11,
  BALL_SPEED: 1500,        // px per second
  FIRE_DELAY: 0.06,        // seconds between balls in a volley
  MIN_AIM_DEG: 8,          // shots flatter than this are cancelled
  MIN_BOUNCE_SIN: 0.12,    // anti-stuck: balls never travel flatter than this
  SLIDE_SPEED: 1900,       // landed balls sliding to the launcher
  RETURN_SPEED: 2800,      // recalled balls flying home

  // Simulation
  STEP: 1 / 120,           // fixed physics timestep
  MAX_STEPS_PER_FRAME: 14,
  FF_AFTER: 6,             // seconds before the fast-forward button shows
  FF_MULT: 2,
  AUTO_RECALL_AFTER: 90,   // safety net for endless bouncing

  // Pickups
  PICKUP_R: 24,

  // Level mode
  LEVEL_COUNT: 60,
  STAR3: 0.6,              // 3 stars if shots used <= 60% of allowed
  STAR2: 0.85,             // 2 stars if <= 85%
  GEN_HITS_PER_BALL: 1.6,  // fallback for levels beyond GEN_SHOTS: hits per ball per shot (lower = more shots)

  // Challenge mode
  CH_MIN_BRICKS: 2, CH_MAX_BRICKS: 5,
  CH_DOUBLE_HP_CHANCE: 0.22,
  CH_TRIANGLE_FROM_TURN: 8, CH_TRIANGLE_CHANCE: 0.15,
  CH_COIN_CHANCE: 0.28, CH_LASER_CHANCE: 0.11, CH_SCATTER_CHANCE: 0.06,

  // Economy
  COIN_LEVEL_BASE: 10, COIN_PER_STAR: 5, COIN_REPLAY: 5,
  COIN_EVERY_TURNS: 5,
  PRICES: { bomb: 40, double: 30, row: 50 },
  START_INV: 2,
};

const W = CONFIG.W, H = CONFIG.H, COLS = CONFIG.COLS, ROWS = CONFIG.ROWS, CELL = CONFIG.CELL;
const FX0 = CONFIG.FIELD_X, FY0 = CONFIG.FIELD_Y;
const FW = COLS * CELL, FH = ROWS * CELL;
const FLOOR = FY0 + FH;
const R = CONFIG.BALL_R;

// Hooks the UI layer fills in (sounds, particles). No-ops by default.
const FX = { hit() {}, brk() {}, pick() {}, laser() {}, scatter() {}, land() {}, cleared() {}, turnEnd() {}, bomb() {} };

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

/* ---------- Grid objects ---------- */
// Triangle shapes are named by the corner holding the right angle:
// a = bottom-left, b = bottom-right, c = top-left, d = top-right
function makeBrick(hp, shape) { return { k: 'brick', hp, max: hp, shape: shape || 'sq', flash: 0, pop: 0, v: null }; }
function makePickup(kind) { return { k: 'pick', kind, used: false, ph: Math.random() * 6.28 }; }
function emptyGrid() { const g = []; for (let r = 0; r < ROWS; r++) g.push(new Array(COLS).fill(null)); return g; }

// Collision uses the FULL cell (no gap) so two neighbouring bricks form one flat
// surface. Drawing insets them a little so they still look separate.
function cellVerts(c, r, shape) {
  const x0 = FX0 + c * CELL, y0 = FY0 + r * CELL, x1 = x0 + CELL, y1 = y0 + CELL;
  switch (shape) {
    case 'a': return [[x0, y0], [x1, y1], [x0, y1]];
    case 'b': return [[x1, y0], [x1, y1], [x0, y1]];
    case 'c': return [[x0, y0], [x1, y0], [x0, y1]];
    case 'd': return [[x0, y0], [x1, y0], [x1, y1]];
    default:  return [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
  }
}
function refreshVerts(G) {
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const o = G.grid[r][c];
    if (o && o.k === 'brick') o.v = cellVerts(c, r, o.shape);
  }
}
function countBricks(G) {
  let n = 0;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { const o = G.grid[r][c]; if (o && o.k === 'brick') n++; }
  return n;
}

/* ---------- Collision: circle vs convex polygon ----------
   Returns null, or {nx, ny, pen}: the push-out normal and how deep the ball is.
   1. Find the closest point on the polygon outline to the ball centre.
   2. If the centre is outside: normal points from that point to the centre,
      depth = radius - distance. Corners fall out of this naturally.
   3. If the centre is somehow inside (fast hit): use the nearest edge's
      outward normal, depth = radius + distance, so it gets pushed fully out. */
function collidePoly(px, py, rad, v) {
  const n = v.length;
  let best = Infinity, qx = 0, qy = 0, ei = 0, pos = 0, neg = 0;
  for (let i = 0; i < n; i++) {
    const a = v[i], b = v[(i + 1) % n];
    const ex = b[0] - a[0], ey = b[1] - a[1];
    const cr = ex * (py - a[1]) - ey * (px - a[0]);
    if (cr > 0) pos++; else if (cr < 0) neg++;
    let t = ((px - a[0]) * ex + (py - a[1]) * ey) / (ex * ex + ey * ey);
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const cx = a[0] + ex * t, cy = a[1] + ey * t;
    const dx = px - cx, dy = py - cy, d = dx * dx + dy * dy;
    if (d < best) { best = d; qx = cx; qy = cy; ei = i; }
  }
  const d = Math.sqrt(best);
  const inside = pos === 0 || neg === 0;
  if (inside) {
    const a = v[ei], b = v[(ei + 1) % n];
    let nx = b[1] - a[1], ny = -(b[0] - a[0]);
    const L = Math.hypot(nx, ny); nx /= L; ny /= L;
    let cx = 0, cy = 0; for (const p of v) { cx += p[0]; cy += p[1]; } cx /= n; cy /= n;
    if ((a[0] - cx) * nx + (a[1] - cy) * ny < 0) { nx = -nx; ny = -ny; }
    return { nx, ny, pen: rad + d };
  }
  if (d >= rad) return null;
  return { nx: (px - qx) / d, ny: (py - qy) / d, pen: rad - d };
}

// Anti-stuck: keep speed constant and never let a ball travel almost flat.
function fixAngle(b) {
  const S = CONFIG.BALL_SPEED, minVy = S * CONFIG.MIN_BOUNCE_SIN;
  let sp = Math.hypot(b.vx, b.vy) || 1;
  b.vx = b.vx / sp * S; b.vy = b.vy / sp * S;
  if (Math.abs(b.vy) < minVy) {
    b.vy = minVy; // nudge downward so it comes home
    b.vx = Math.sign(b.vx || 1) * Math.sqrt(S * S - minVy * minVy);
  }
}

/* ---------- Damage and pickups ---------- */
function damageBrick(G, r, c, dmg) {
  const o = G.grid[r][c];
  if (!o || o.k !== 'brick') return;
  o.hp -= dmg; o.flash = 1; o.pop = 1;
  G.score += 1;
  FX.hit(G, o, r, c);
  if (o.hp <= 0) {
    G.grid[r][c] = null;
    G.score += 10; G.broken++;
    FX.brk(G, o, r, c);
    if (G.mode === 'level' && !G.cleared && countBricks(G) === 0) {
      G.cleared = true;
      FX.cleared(G);
      recallAll(G);
    }
  }
}

function touchPickup(G, o, r, c, b) {
  switch (o.kind) {
    case 'plus': G.grid[r][c] = null; G.pending++; FX.pick(G, o, r, c); break;
    case 'coin': G.grid[r][c] = null; G.coinsGot++; FX.pick(G, o, r, c); break;
    case 'hl':
      o.used = true; FX.laser(G, 'h', r, c);
      for (let cc = 0; cc < COLS; cc++) damageBrick(G, r, cc, G.dmg);
      break;
    case 'vl':
      o.used = true; FX.laser(G, 'v', r, c);
      for (let rr = 0; rr < ROWS; rr++) damageBrick(G, rr, c, G.dmg);
      break;
    case 'sc': {
      o.used = true;
      const a = (20 + G.rand() * 140) * Math.PI / 180;
      b.vx = Math.cos(a) * CONFIG.BALL_SPEED; b.vy = -Math.sin(a) * CONFIG.BALL_SPEED;
      FX.scatter(G, r, c);
      break;
    }
  }
}

/* ---------- One ball, one timestep ----------
   The step is split into sub-steps no longer than ~half the ball radius, so a
   ball can never jump through a brick. Each sub-step resolves only the deepest
   brick contact; that keeps seams between flush bricks from double-bouncing
   and means a single contact damages a single brick. */
function stepBall(G, b, dt) {
  const n = Math.max(1, Math.ceil(CONFIG.BALL_SPEED * dt / (R * 0.45)));
  const sdt = dt / n;
  const PR = R + CONFIG.PICKUP_R, PR2 = PR * PR;
  for (let s = 0; s < n; s++) {
    b.x += b.vx * sdt; b.y += b.vy * sdt;
    let bounced = false;
    if (b.x < FX0 + R) { b.x = FX0 + R; if (b.vx < 0) { b.vx = -b.vx; bounced = true; } }
    else if (b.x > FX0 + FW - R) { b.x = FX0 + FW - R; if (b.vx > 0) { b.vx = -b.vx; bounced = true; } }
    if (b.y < FY0 + R) { b.y = FY0 + R; if (b.vy < 0) { b.vy = -b.vy; bounced = true; } }

    const col = Math.floor((b.x - FX0) / CELL), row = Math.floor((b.y - FY0) / CELL);
    let best = null, br = 0, bc = 0, touch = null, tr = 0, tc = 0;
    for (let r = row - 1; r <= row + 1; r++) {
      if (r < 0 || r >= ROWS) continue;
      const gr = G.grid[r];
      for (let c = col - 1; c <= col + 1; c++) {
        if (c < 0 || c >= COLS) continue;
        const o = gr[c];
        if (!o) continue;
        if (o.k === 'brick') {
          const h = collidePoly(b.x, b.y, R, o.v);
          if (h && (!best || h.pen > best.pen)) { best = h; br = r; bc = c; }
        } else {
          const dx = b.x - (FX0 + c * CELL + CELL / 2), dy = b.y - (FY0 + r * CELL + CELL / 2);
          if (dx * dx + dy * dy < PR2) { touch = o; tr = r; tc = c; }
        }
      }
    }
    if (best) {
      b.x += best.nx * best.pen; b.y += best.ny * best.pen;
      const dot = b.vx * best.nx + b.vy * best.ny;
      if (dot < 0) { b.vx -= 2 * dot * best.nx; b.vy -= 2 * dot * best.ny; bounced = true; }
      damageBrick(G, br, bc, G.dmg);
      if (b.state !== 'fly') return; // level cleared: ball was recalled
    }
    if (touch !== b.touch) {
      if (touch) touchPickup(G, touch, tr, tc, b);
      b.touch = touch;
      if (b.state !== 'fly') return;
    }
    if (bounced) fixAngle(b);
    if (b.vy > 0 && b.y >= FLOOR - R) { b.y = FLOOR - R; landBall(G, b); return; }
  }
}

function landBall(G, b) {
  if (G.firstX === null) { G.firstX = clamp(b.x, FX0 + R, FX0 + FW - R); b.state = 'done'; }
  else b.state = 'slide';
  FX.land(G, b);
}

function recallAll(G) {
  G.toFire = 0;
  for (const b of G.balls) if (b.state === 'fly') b.state = 'return';
}

/* ---------- Turns ---------- */
function canAim(ang) { return ang >= CONFIG.MIN_AIM_DEG * Math.PI / 180 && ang <= Math.PI - CONFIG.MIN_AIM_DEG * Math.PI / 180; }

function fire(G, ang) {
  G.phase = 'fire';
  G.toFire = G.ballCount; G.fired = 0; G.fireTimer = 0;
  G.firstX = null; G.balls = []; G.turnTime = 0; G.ff = false;
  G.dirX = Math.cos(ang); G.dirY = -Math.sin(ang);
  G.dmg = G.dblArmed ? 2 : 1; G.dblArmed = false;
  if (G.mode === 'level') G.shotsUsed++;
}

function updateTurn(G, dt) {
  if (G.phase !== 'fire') return;
  G.turnTime += dt;
  if (G.toFire > 0) {
    G.fireTimer -= dt;
    while (G.toFire > 0 && G.fireTimer <= 0) {
      G.balls.push({ x: G.launchX, y: FLOOR - R, vx: G.dirX * CONFIG.BALL_SPEED, vy: G.dirY * CONFIG.BALL_SPEED, state: 'fly', touch: null, i: G.fired });
      G.toFire--; G.fired++;
      G.fireTimer += CONFIG.FIRE_DELAY;
    }
  }
  if (G.turnTime > CONFIG.AUTO_RECALL_AFTER) recallAll(G);
  const tx = G.firstX === null ? G.launchX : G.firstX;
  let busy = G.toFire > 0;
  for (const b of G.balls) {
    if (b.state === 'fly') { stepBall(G, b, dt); busy = true; }
    else if (b.state === 'slide') {
      const d = tx - b.x, m = CONFIG.SLIDE_SPEED * dt;
      if (Math.abs(d) <= m) { b.x = tx; b.state = 'done'; } else { b.x += Math.sign(d) * m; busy = true; }
    } else if (b.state === 'return') {
      const dx = tx - b.x, dy = (FLOOR - R) - b.y, L = Math.hypot(dx, dy), m = CONFIG.RETURN_SPEED * dt;
      if (L <= m) { b.x = tx; b.y = FLOOR - R; b.state = 'done'; if (G.firstX === null) G.firstX = tx; }
      else { b.x += dx / L * m; b.y += dy / L * m; busy = true; }
    }
  }
  if (!busy) endTurn(G);
}

function endTurn(G) {
  G.phase = 'aim';
  G.launchX = clamp(G.firstX === null ? G.launchX : G.firstX, FX0 + R + 2, FX0 + FW - R - 2);
  G.ballCount += G.pending; G.pending = 0;
  G.dmg = 1; G.balls.length = 0;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const o = G.grid[r][c];
    if (o && o.k === 'pick' && o.used) G.grid[r][c] = null;
  }
  if (G.mode === 'level') {
    if (countBricks(G) === 0) G.result = 'win';
    else if (G.shotsUsed >= G.shots) G.result = 'lose';
  } else {
    G.turn++;
    shiftDown(G);
    spawnRow(G);
    refreshVerts(G);
    for (let c = 0; c < COLS; c++) { const o = G.grid[ROWS - 1][c]; if (o && o.k === 'brick') G.result = 'lose'; }
  }
  FX.turnEnd(G);
}

function shiftDown(G) {
  for (let r = ROWS - 1; r > 0; r--) G.grid[r] = G.grid[r - 1];
  G.grid[0] = new Array(COLS).fill(null);
  // Pickups that reach the bottom row: +1 rings are collected for free, the rest vanish.
  for (let c = 0; c < COLS; c++) {
    const o = G.grid[ROWS - 1][c];
    if (o && o.k === 'pick') { if (o.kind === 'plus') G.ballCount++; G.grid[ROWS - 1][c] = null; }
  }
  G.shift = 1;
}

/* ---------- Challenge rows ---------- */
function spawnRow(G) {
  const rng = G.rand, t = G.turn, row = G.grid[0];
  const cols = [0, 1, 2, 3, 4, 5, 6];
  for (let i = cols.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [cols[i], cols[j]] = [cols[j], cols[i]]; }
  let i = 0;
  row[cols[i++]] = makePickup('plus');
  let nb = CONFIG.CH_MIN_BRICKS + Math.floor(rng() * (CONFIG.CH_MAX_BRICKS - CONFIG.CH_MIN_BRICKS + 1));
  if (t > 25 && rng() < 0.5) nb++;
  nb = Math.min(nb, COLS - 1);
  for (let k = 0; k < nb; k++) {
    const hp = rng() < CONFIG.CH_DOUBLE_HP_CHANCE ? t * 2 : t;
    const shape = (t >= CONFIG.CH_TRIANGLE_FROM_TURN && rng() < CONFIG.CH_TRIANGLE_CHANCE) ? 'abcd'[Math.floor(rng() * 4)] : 'sq';
    row[cols[i++]] = makeBrick(hp, shape);
  }
  let extras = 0;
  while (i < COLS && extras < 2) {
    const x = rng();
    if (x < CONFIG.CH_COIN_CHANCE) row[cols[i++]] = makePickup('coin');
    else if (x < CONFIG.CH_COIN_CHANCE + CONFIG.CH_LASER_CHANCE) row[cols[i++]] = makePickup(rng() < 0.5 ? 'hl' : 'vl');
    else if (x < CONFIG.CH_COIN_CHANCE + CONFIG.CH_LASER_CHANCE + CONFIG.CH_SCATTER_CHANCE) row[cols[i++]] = makePickup('sc');
    extras++;
  }
}

/* ---------- Levels ----------
   Tokens, 7 per row, top row first:
   .  empty      12  square brick with 12 HP      12a/b/c/d  triangle brick
   P  +1 ball    H / V  horizontal / vertical laser    S  scatter    C  coin */
const HAND_LEVELS = [
  { balls: 3, shots: 4, rows: [
    '. . . . . . .',
    '. . . . . . .',
    '. . 1 2 1 . .'] },
  { balls: 4, shots: 7, rows: [
    '. . . . . . .',
    '. 2 2 2 2 2 .',
    '. . 3 P 3 . .'] },
  { balls: 5, shots: 12, rows: [
    '2 3 3 3 3 3 2',
    '. . . . . . .',
    '. 4 4 4 4 4 .'] },
  { balls: 5, shots: 8, rows: [
    '. . . . . . .',
    '3c . 3 3 3 . 3d',
    '. 3a 4 P 4 3b .',
    '. . 3 3 3 . .'] },
  { balls: 5, shots: 8, rows: [
    '. . . . . . .',
    '4 4 4 H 4 4 4',
    '. . . . . . .',
    '3 . 3 V 3 . 3'] },
  { balls: 6, shots: 10, rows: [
    '3 3 3 3 3 3 3',
    '. . . . . . .',
    '12 . . 12 . . 12',
    '. P . . . P .'] },
  { balls: 7, shots: 11, rows: [
    '5 5 5 5 5 5 5',
    '5 . C S C . 5',
    '5 5 5 . 5 5 5'] },
  { balls: 8, shots: 12, rows: [
    '. . 6b 6 6a . .',
    '. 6b 8 8 8 6a .',
    '. 6d 8 H 8 6c .',
    '. . 6d 6 6c . .',
    '. . . P . . .'] },
  { balls: 9, shots: 13, rows: [
    '8 . 8 . 8 . 8',
    '8 . 8 V 8 . 8',
    '8 P 8 . 8 P 8',
    '8 . 8 . 8 . 8'] },
  { balls: 10, shots: 14, rows: [
    '4 4 4 4 4 4 4',
    '4 . . . . . 4',
    '4 . 30 30 30 . 4',
    '4 . . H . . 4',
    '. . P . P . .'] },
  { balls: 10, shots: 15, rows: [
    '10 10 10 10 10 10 10',
    '. . . C . . .',
    '8c 8 . . . 8 8d',
    '. 8c 8 . 8 8d .',
    '. . 8c P 8d . .'] },
  { balls: 11, shots: 12, rows: [
    '9 . 9 . 9 . 9',
    '. 9 . 9 . 9 .',
    '9 . 9 H 9 . 9',
    '. 9 . 9 . 9 .',
    '9 . P . P . 9'] },
  { balls: 12, shots: 15, rows: [
    '10 10 10 10 10 10 10',
    '10 10 V 10 V 10 10',
    '. . . . . . .',
    '14 14 14 H 14 14 14',
    '. P . . . P .'] },
  { balls: 13, shots: 13, rows: [
    '6 6 6 6 6 6 6',
    '6 C . . . C 6',
    '6 . 15 15 15 . 6',
    '6 . 15 S 15 . 6',
    '6 . . . . . 6',
    '20 20 . . . 20 20'] },
  { balls: 14, shots: 16, rows: [
    '12c 15 18 20 18 15 12d',
    '15 . . P . . 15',
    '15 . 25b 25 25a . 15',
    '15 H 25d 40 25c H 15',
    '15 . . . . . 15',
    '. 20 . V . 20 .'] },
];

function parseLevel(def) {
  const grid = emptyGrid();
  def.rows.forEach((line, r) => {
    line.trim().split(/\s+/).forEach((tok, c) => {
      if (tok === '.' || c >= COLS) return;
      const kinds = { P: 'plus', H: 'hl', V: 'vl', S: 'sc', C: 'coin' };
      if (kinds[tok]) { grid[r][c] = makePickup(kinds[tok]); return; }
      const m = tok.match(/^(\d+)([abcd]?)$/);
      if (m) grid[r][c] = makeBrick(+m[1], m[2] || 'sq');
    });
  });
  return grid;
}

// Shot budgets for generated levels 16+, measured by playing each level with a
// simple aiming bot (tools: sim). Levels past this table fall back to the formula.
const GEN_SHOTS = [20,14,10,22,14,9,18,14,14,19,15,20,24,20,13,17,29,17,15,21,21,19,32,23,33,19,27,22,35,25,34,33,27,34,43,27,30,39,32,34,37,26,32,27,31];

// Levels 16+ come from a seeded generator, so level 37 is always the same level.
// Layouts are mirrored left/right so they read as designed rather than random.
function genLevel(n) {
  const rng = mulberry32(n * 7919 + 13);
  const t = clamp((n - 16) / Math.max(1, CONFIG.LEVEL_COUNT - 16), 0, 1);
  const grid = emptyGrid();
  const rows = Math.min(8, 4 + Math.floor(t * 4.5));
  const density = 0.42 + t * 0.3;
  const hpBase = 3 + n * 0.5;
  const triP = 0.06 + t * 0.2;
  const mirror = { sq: 'sq', a: 'b', b: 'a', c: 'd', d: 'c' };
  let tries = 0;
  do {
    for (let r = 0; r < ROWS; r++) grid[r].fill(null);
    for (let r = 0; r < rows; r++) for (let c = 0; c <= 3; c++) {
      if (rng() >= density) continue;
      let hp = Math.max(1, Math.round(hpBase * (0.6 + rng() * 0.8)));
      if (rng() < 0.07 + t * 0.06) hp = Math.round(hp * 2.5); // blocker
      const shape = rng() < triP ? 'abcd'[Math.floor(rng() * 4)] : 'sq';
      grid[r][c] = makeBrick(hp, shape);
      if (c !== 3) grid[r][6 - c] = makeBrick(hp, mirror[shape]);
    }
    tries++;
  } while (countBricks({ grid }) < 6 && tries < 20);

  const empties = [];
  for (let r = 0; r < rows + 1; r++) for (let c = 0; c < COLS; c++) if (!grid[r][c]) empties.push([r, c]);
  const place = (kind) => { if (!empties.length) return; const k = Math.floor(rng() * empties.length); const [r, c] = empties.splice(k, 1)[0]; grid[r][c] = makePickup(kind); };
  const plusCount = 1 + Math.floor(rng() * 2) + (t > 0.5 ? 1 : 0);
  for (let i = 0; i < plusCount; i++) place('plus');
  const lasers = Math.floor(rng() * 2 + t * 1.5);
  for (let i = 0; i < lasers; i++) place(rng() < 0.5 ? 'hl' : 'vl');
  if (rng() < 0.3) place('sc');
  const coins = 1 + Math.floor(rng() * 2);
  for (let i = 0; i < coins; i++) place('coin');

  let total = 0;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { const o = grid[r][c]; if (o && o.k === 'brick') total += o.hp; }
  const balls = 3 + Math.floor(n * 0.45);
  const spare = 3 - Math.round(t);
  const shots = GEN_SHOTS[n - 16] || (Math.ceil(total / (balls * CONFIG.GEN_HITS_PER_BALL)) + spare);
  return { balls, shots, grid };
}

function getLevel(n) {
  if (n <= HAND_LEVELS.length) { const d = HAND_LEVELS[n - 1]; return { balls: d.balls, shots: d.shots, grid: parseLevel(d) }; }
  return genLevel(n);
}

function starsFor(used, shots) {
  if (used <= Math.ceil(shots * CONFIG.STAR3)) return 3;
  if (used <= Math.ceil(shots * CONFIG.STAR2)) return 2;
  return 1;
}

function newGame(mode, level, seed) {
  const G = {
    mode, level, grid: emptyGrid(), balls: [], ballCount: 1,
    launchX: FX0 + FW / 2, phase: 'aim', toFire: 0, fired: 0, fireTimer: 0, firstX: null,
    pending: 0, dmg: 1, turn: 1, shots: 0, shotsUsed: 0, score: 0, broken: 0,
    cleared: false, result: null, turnTime: 0, coinsGot: 0, shift: 0, ff: false,
    dblArmed: false, continued: false, dirX: 0, dirY: -1, hpRef: 10,
    rand: mulberry32(seed === undefined ? (Math.random() * 1e9) | 0 : seed),
  };
  if (mode === 'level') {
    const L = getLevel(level);
    G.grid = L.grid; G.ballCount = L.balls; G.shots = L.shots;
    let mx = 1; for (const row of G.grid) for (const o of row) if (o && o.k === 'brick') mx = Math.max(mx, o.hp);
    G.hpRef = Math.max(4, mx);
  } else {
    spawnRow(G);
  }
  refreshVerts(G);
  return G;
}

/* ---------- Power-ups ---------- */
function bombAt(G, r, c) {
  const o = G.grid[r][c];
  if (!o || o.k !== 'brick') return false;
  FX.bomb(G, r, c);
  damageBrick(G, r, c, o.hp);
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    const rr = r + dr, cc = c + dc;
    if ((dr || dc) && rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS) {
      const n = G.grid[rr][cc];
      if (n && n.k === 'brick') damageBrick(G, rr, cc, Math.max(1, Math.ceil(n.hp / 2)));
    }
  }
  return true;
}
function clearLowestRow(G) {
  for (let r = ROWS - 1; r >= 0; r--) {
    let any = false;
    for (let c = 0; c < COLS; c++) { const o = G.grid[r][c]; if (o && o.k === 'brick') { any = true; damageBrick(G, r, c, o.hp); } }
    if (any) return true;
  }
  return false;
}
function continueChallenge(G) {
  for (let r = ROWS - 3; r < ROWS; r++) G.grid[r].fill(null);
  G.result = null; G.continued = true; G.phase = 'aim';
}

const AU = { ctx: null, master: null, last: {} };
function audioInit() {
  try {
    if (!AU.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      AU.ctx = new AC();
      AU.master = AU.ctx.createGain(); AU.master.gain.value = 0.55; AU.master.connect(AU.ctx.destination);
    }

  } catch (e) {}
}
function tone(f, dur, type, vol, f2, delay) {
  if (!AU.ctx || !SAVE.sound) return;
  try {
    const t = AU.ctx.currentTime + (delay || 0);
    const o = AU.ctx.createOscillator(), g = AU.ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AU.master);
    o.start(t); o.stop(t + dur + 0.03);
  } catch (e) {}
}
function sfx(name, arg) {
  if (!AU.ctx || !SAVE.sound) return;
  const now = performance.now() / 1000;
  const gap = { hit: 0.028, fire: 0.05, brk: 0.035 }[name] || 0;
  if (gap && now - (AU.last[name] || 0) < gap) return;
  AU.last[name] = now;
  switch (name) {
    case 'hit': tone(320 + ((arg || 1) % 14) * 38, 0.05, 'square', 0.045); break;
    case 'brk': tone(620, 0.14, 'triangle', 0.16, 1250); break;

    case 'coin': tone(988, 0.07, 'square', 0.07); tone(1319, 0.14, 'square', 0.07, null, 0.07); break;
    case 'laser': tone(1500, 0.2, 'sawtooth', 0.06, 180); break;
    case 'scatter': tone(300, 0.12, 'triangle', 0.1, 900); break;
    case 'bomb': tone(170, 0.45, 'sawtooth', 0.18, 38); break;
    case 'click': tone(720, 0.05, 'sine', 0.09); break;
    case 'buy': tone(660, 0.08, 'triangle', 0.12); tone(990, 0.16, 'triangle', 0.12, null, 0.08); break;

const rampCache = [];

  const a = RAMP[k], b = RAMP[k + 1];

    gr.addColorStop(0, '#FFF6C8'); gr.addColorStop(0.5, '#FFC94A'); gr.addColorStop(1, '#B9740F');
    g.shadowColor = '#FFC94A'; g.shadowBlur = 8;

  } else if (s.plasma) {

    g.shadowColor = '#FF4FD8'; g.shadowBlur = 12;

  } else if (s.eclipse) {

}

        await Purchases.configure({ apiKey: MONEY.REVENUECAT_API_KEY });
        await refreshPurchases();
        const r = await Purchases.getProducts({ productIdentifiers: [MONEY.REMOVE_ADS_PRODUCT], type: 'NON_SUBSCRIPTION' });
        st.product = (r && r.products && r.products[0]) || null;
        st.price = st.product ? st.product.priceString : null;
      } catch (e) { console.warn('Store init failed', e); }
    } else if (native) {
      console.warn('Remove Ads is off: set MONEY.REVENUECAT_API_KEY');
    }
  }

  // Remove Ads lives on the player's Google account: RevenueCat asks Google Play,
  // so a reinstall or a new phone with the same account gets it back.
  function applyCustomerInfo(info) {
    const active = (info && info.entitlements && info.entitlements.active) || {};
    const owned = !!active[MONEY.REMOVE_ADS_ENTITLEMENT];
    if (owned !== SAVE.noAds) { SAVE.noAds = owned; persist(); }
    return owned;
  }
  async function refreshPurchases() {
    if (!Purchases) return false;
    const r = await Purchases.getCustomerInfo();
    return applyCustomerInfo(r && r.customerInfo);
  }

  // Rewarded ad. Resolves 'earned', 'skipped' (closed early) or 'unavailable'.
  function rewarded() {
    if (st.busy) return Promise.resolve('busy');
    if (!native) return testing ? fakeAd(true) : Promise.resolve('earned');
    if (!AdMob || !st.ready || !st.canRequest) return Promise.resolve('unavailable');
    st.busy = true;
    return new Promise((resolve) => {
      let done = false;
      const finish = (v) => {
        if (done) return; done = true;
        st.busy = false; st.onRewardDone = null; st.rewardedReady = false;
        resolve(v); setTimeout(preloadRewarded, 500);
      };
      st.earned = false; st.shown = false;
      st.onRewardDone = () => setTimeout(() => finish(st.earned ? 'earned' : 'skipped'), 300);
      setTimeout(() => finish(st.earned ? 'earned' : 'unavailable'), 180000); // safety net
      (async () => {
        try {
          if (!st.rewardedReady) await AdMob.prepareRewardVideoAd({ adId: ids.rewarded, isTesting: testing });
          st.rewardedReady = false;
          await AdMob.showRewardVideoAd();
          st.earned = true;
        } catch (e) {
          setTimeout(() => finish(st.earned ? 'earned' : (st.shown ? 'skipped' : 'unavailable')), 600);
        }
      })();
    });
  }

  // Full-screen ad between games, only when one is due. Calls next() either way.
  // It only shows an ad that has already loaded, so the player never waits on the network.
  function between(kind, next) {
    const every = kind === 'level' ? MONEY.INTERSTITIAL_EVERY_LEVELS : MONEY.INTERSTITIAL_EVERY_CHALLENGE_RUNS;
    const count = kind === 'level' ? SAVE.winsSinceAd : SAVE.runsSinceAd;
    const due = !SAVE.noAds && count >= every && now() - st.lastFull >= MONEY.INTERSTITIAL_MIN_GAP_SEC;
    if (!due || st.busy) { next(); return; }
    const reset = () => {
      st.lastFull = now();
      if (kind === 'level') SAVE.winsSinceAd = 0; else SAVE.runsSinceAd = 0;
      persist();
    };
    if (!native) { if (!testing) { next(); return; } reset(); fakeAd(false).then(next); return; }
    if (!AdMob || !st.ready || !st.canRequest || !st.interReady) { preloadInter(); next(); return; }
    st.busy = true;
    let done = false;
    const finish = () => {
      if (done) return; done = true;
      st.busy = false; st.onInterDone = null; st.interReady = false;
      next(); setTimeout(preloadInter, 500);
    };
    st.onInterDone = finish;
    reset();
    AdMob.showInterstitial().catch(finish);
    setTimeout(finish, 120000);
  }

  // Banner on menu screens only. Called every frame; only acts on a change.
  function setBanner(want) {
    want = !!want && !SAVE.noAds;
    if (!native) { st.bannerWanted = want && testing; return; }
    if (!AdMob || !st.ready || !st.canRequest || want === st.bannerWanted) return;
    st.bannerWanted = want;
    if (want) {
      if (st.banner) AdMob.resumeBanner().catch(() => {});
      else AdMob.showBanner({ adId: ids.banner, adSize: 'ADAPTIVE_BANNER', position: 'BOTTOM_CENTER', margin: 0, isTesting: testing })
        .then(() => { st.banner = true; }).catch(() => { st.bannerWanted = false; });
    } else if (st.banner) AdMob.hideBanner().catch(() => {});
  }

  // Remove Ads purchase. Resolves 'owned', 'cancelled', 'failed', 'web' or 'nostore'.
  async function buyRemoveAds() {
    if (SAVE.noAds) return 'owned';
    if (!native) return 'web';
    if (!Purchases) return 'nostore';
    try {
      await st.initP;
      if (!st.product) {
        const r = await Purchases.getProducts({ productIdentifiers: [MONEY.REMOVE_ADS_PRODUCT], type: 'NON_SUBSCRIPTION' });
        st.product = (r && r.products && r.products[0]) || null;
      }
      if (!st.product) return 'nostore';
      const r = await Purchases.purchaseStoreProduct({ product: st.product });
      const owned = applyCustomerInfo(r && r.customerInfo);
      if (owned) setBanner(false);
      return owned ? 'owned' : 'failed';
    } catch (e) {
      const cancelled = e && (e.userCancelled || String(e.code) === '1' || /cancel/i.test(String(e.message || e)));
      return cancelled ? 'cancelled' : 'failed';
    }
  }
  async function restore() {
    if (!native) return 'web';
    if (!Purchases) return 'nostore';
    try {
      await st.initP;
      const r = await Purchases.restorePurchases();
      return applyCustomerInfo(r && r.customerInfo) ? 'owned' : 'none';
    } catch (e) { return 'failed'; }
  }
  function privacyForm() { if (AdMob) AdMob.showPrivacyOptionsForm().catch(() => {}); }

  // Browser stand-in for a real ad, so placements can be tested without a phone.
  function fakeAd(isRewarded) {
    return new Promise((resolve) => { ui.fakeAd = { t: 0, rewarded: isRewarded, need: isRewarded ? 5 : 2, resolve }; });
  }

  st.initP = new Promise((r) => setTimeout(() => init().then(r, r), 400));
  return {
    rewarded, between, setBanner, buyRemoveAds, restore, privacyForm,
    get native() { return native; },
    get price() { return st.price || MONEY.REMOVE_ADS_PRICE_FALLBACK; },
    get privacyRequired() { return st.privacyRequired; },
    get bannerWanted() { return st.bannerWanted; },
  };
})();

// Play a rewarded ad, then run onEarn only if the player watched it to the end.
function withReward(onEarn) {
  if (ui.adBusy) return;
  ui.adBusy = true;
  Ads.rewarded().then((r) => {
    ui.adBusy = false;
    if (r === 'earned') { sfx('buy'); onEarn(); }
    else if (r === 'skipped') toast('Watch to the end to get the reward');
    else if (r === 'unavailable') toast('No ad available right now. Try again in a moment.');
  });
}

FX.hit = (g, o) => { sfx('hit', o.hp); };
FX.brk = (g, o, r, c) => {
  sfx('brk');

  const col = brickRGB(o.max, g.hpRef);
  for (let i = 0; i < 12 && particles.length < 700; i++) {
    const a = Math.random() * 6.28, s = 120 + Math.random() * 380;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120, life: 0.55 + Math.random() * 0.35, max: 0.9, col, size: 5 + Math.random() * 7 });
  }

FX.pick = (g, o, r, c) => {

  if (o.kind === 'plus') { sfx('plus'); texts.push({ x, y, text: '+1', col: '#FFFFFF', t: 0, life: 0.9 }); }
  if (o.kind === 'coin') { sfx('coin'); SAVE.coins++; texts.push({ x, y, text: '+1', col: COL.gold, t: 0, life: 0.9, coin: true }); }
};
FX.laser = (g, dir, r, c) => { sfx('laser'); beams.push({ dir, r, c, t: 0, life: 0.28 }); };
FX.scatter = (g, r, c) => { sfx('scatter'); const [x, y] = cellCenter(r, c); rings.push({ x, y, t: 0, col: [255, 201, 74] }); };

FX.bomb = (g, r, c) => { sfx('bomb'); const [x, y] = cellCenter(r, c); rings.push({ x, y, t: 0, col: [255, 120, 60], big: true }); ui.shake = 12; };
FX.turnEnd = (g) => {
  persist();
  if (g.result) setTimeout(() => showResult(g), g.mode === 'level' && g.result === 'win' ? 450 : 250);
};

function showResult(g) {
  if (G !== g || ui.overlay) return;
  if (g.mode === 'level') {
    if (g.result === 'win') {
      const stars = starsFor(g.shotsUsed, g.shots);
      const prev = SAVE.stars[g.level] || 0;
      const coins = stars > prev ? CONFIG.COIN_LEVEL_BASE + stars * CONFIG.COIN_PER_STAR : CONFIG.COIN_REPLAY;
      SAVE.stars[g.level] = Math.max(prev, stars);
      SAVE.unlocked = Math.max(SAVE.unlocked, Math.min(CONFIG.LEVEL_COUNT, g.level + 1));
      SAVE.coins += coins;
      SAVE.winsSinceAd++;
      SAVE.fails[g.level] = 0;
      ui.result = { stars, coins, firstStars: stars > prev, doubled: false };
      sfx('win'); openOverlay('win');
    } else {
      SAVE.fails[g.level] = (SAVE.fails[g.level] || 0) + 1;
      sfx('lose'); openOverlay('lose');
    }
  } else {
    const score = g.turn - 1;
    const isBest = score > SAVE.best;
    if (isBest) SAVE.best = score;
    const total = Math.floor(score / CONFIG.COIN_EVERY_TURNS);
    const coins = total - (g.coinsPaid || 0);
    g.coinsPaid = total;
    SAVE.coins += coins;
    if (!g.runCounted) { g.runCounted = true; SAVE.runsSinceAd++; }
    ui.result = { score, isBest, coins };
    sfx('lose'); openOverlay('over');
  }
  persist();
}

function rr(x, y, w, h, r) {

function txt(s, x, y, size, color, align, font, weight) {

  ctx.fillText(s, x, y);
}

function hitRect(id, x, y, w, h, fn, opt) { ui.hits.push({ id, x, y, w, h, fn, disabled: opt && opt.disabled, sound: !(opt && opt.silent) }); }
function isPressed(id) { return ui.press && ui.press.id === id; }

// style: 'primary' | 'secondary' | 'gold' | 'danger'
function button(id, x, y, w, h, label, style, fn, opt) {
  opt = opt || {};
  hitRect(id, x, y, w, h, fn, opt);
  const p = isPressed(id);
  ctx.save();
  const cx = x + w / 2, cy = y + h / 2;
  ctx.translate(cx, cy); if (p) ctx.scale(0.96, 0.96); ctx.translate(-cx, -cy);
  if (opt.disabled) ctx.globalAlpha = 0.4;
  const rad = Math.min(h / 2, 26);
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; rr(x, y + 6, w, h, rad); ctx.fill();
  let top, bot, edge, ink = COL.ink;

  else if (style === 'gold') { top = '#FFDB73'; bot = COL.goldLo; edge = 'rgba(255,248,200,0.6)'; ink = '#2A1A00'; }
  else if (style === 'danger') { top = '#FF7A93'; bot = '#B8243F'; edge = 'rgba(255,210,220,0.45)'; }

  const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, top); g.addColorStop(1, bot);
  rr(x, y, w, h, rad); ctx.fillStyle = g; ctx.fill();

  if (opt.icon) {

    txt(label, cx + h * 0.22, cy + 1, opt.size || 32, ink, 'center', FONT_U, 800);
  } else txt(label, cx, cy + 1, opt.size || 32, ink, 'center', FONT_U, 800);
  if (opt.sub) txt(opt.sub, cx, y + h - 16, 18, ink === COL.ink ? COL.accentHi : '#5A3A00', 'center', FONT_U, 700);

function roundButton(id, cx, cy, r, drawIcon, fn, opt) {
  opt = opt || {};
  hitRect(id, cx - r - 6, cy - r - 6, r * 2 + 12, r * 2 + 12, fn, opt);

  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 2.5; ctx.strokeStyle = opt.active ? '#FFFFFF' : 'rgba(155,164,245,0.55)'; ctx.stroke();

}

/* =====================================================================
   GAME RENDERING
   ===================================================================== */
// Inset polygon used for drawing, so neighbouring bricks show a small gap.
function insetPoly(v, d) {
  let cx = 0, cy = 0; for (const p of v) { cx += p[0]; cy += p[1]; } cx /= v.length; cy /= v.length;
  if (v.length === 4) return [[v[0][0] + d, v[0][1] + d], [v[1][0] - d, v[1][1] + d], [v[2][0] - d, v[2][1] - d], [v[3][0] + d, v[3][1] - d]];
  return v.map(p => { const dx = p[0] - cx, dy = p[1] - cy, L = Math.hypot(dx, dy); return [p[0] - dx / L * d * 1.9, p[1] - dy / L * d * 1.9]; });
}
function polyPath(pts) { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); }

function drawBrick(o, r, c, yOff) {
  const v = insetPoly(cellVerts(c, r, o.shape), 7);
  if (yOff) for (const p of v) p[1] += yOff;
  const col = brickRGB(o.hp, G.hpRef);
  const pop = o.pop;
  ctx.save();
  if (pop > 0) {
    let cx = 0, cy = 0; for (const p of v) { cx += p[0]; cy += p[1]; } cx /= v.length; cy /= v.length;
    const s = 1 + pop * 0.06; ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy);
  }
  ctx.lineJoin = 'round';
  // glow
  polyPath(v); ctx.lineWidth = 18; ctx.strokeStyle = rgb(col, 0.13); ctx.stroke();
  // body (stroke + fill gives rounded corners on any shape)
  polyPath(v); ctx.lineWidth = 10; ctx.strokeStyle = rgb(col); ctx.stroke(); ctx.fillStyle = rgb(col); ctx.fill();
  // top sheen
  const ys = v.map(p => p[1]); const top = Math.min(...ys), bot = Math.max(...ys);
  const g = ctx.createLinearGradient(0, top - 5, 0, bot + 5);
  g.addColorStop(0, 'rgba(255,255,255,0.32)'); g.addColorStop(0.45, 'rgba(255,255,255,0.04)'); g.addColorStop(1, 'rgba(0,0,20,0.22)');
  polyPath(v); ctx.fillStyle = g; ctx.fill();
  if (o.flash > 0) { polyPath(v); ctx.fillStyle = `rgba(255,255,255,${o.flash * 0.55})`; ctx.fill(); }
  // number at the centroid (pulled toward the right-angle corner for triangles)
  let cx = 0, cy = 0; for (const p of v) { cx += p[0]; cy += p[1]; } cx /= v.length; cy /= v.length;
  const s = String(o.hp);
  const size = o.shape === 'sq' ? (s.length > 2 ? 28 : 34) : (s.length > 2 ? 19 : 23);
  ctx.font = `800 ${size}px ${FONT_U}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(10,8,40,0.45)'; ctx.fillText(s, cx, cy + 3);
  ctx.fillStyle = '#FFFFFF'; ctx.fillText(s, cx, cy + 1);
  ctx.restore();
}

function drawPickup(o, r, c, yOff) {
  const [x, y0] = cellCenter(r, c), y = y0 + (yOff || 0);
  const t = ui.t + o.ph;
  ctx.save();
  if (o.kind === 'plus') {
    const pr = 17 + Math.sin(t * 4) * 2.5;
    ctx.beginPath(); ctx.arc(x, y, pr + 7, 0, 7); ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 6; ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, pr, 0, 7); ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 4; ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, 6, 0, 7); ctx.fillStyle = '#FFFFFF'; ctx.fill();
  } else if (o.kind === 'coin') {
    const sx = Math.abs(Math.cos(t * 2.2));
    ctx.translate(x, y); ctx.scale(0.35 + sx * 0.65, 1); coinIcon(0, 0, 16);
  } else if (o.kind === 'hl' || o.kind === 'vl') {
    const h = o.kind === 'hl';
    ctx.translate(x, y); if (!h) ctx.rotate(Math.PI / 2);
    const a = o.used ? 0.45 : 1;
    ctx.globalAlpha = a;
    rr(-26, -11, 52, 22, 11); ctx.fillStyle = 'rgba(56,217,255,0.18)'; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#38D9FF'; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(18, 0); ctx.lineWidth = 4; ctx.strokeStyle = '#DFFBFF'; ctx.lineCap = 'round'; ctx.stroke();
    ctx.fillStyle = '#DFFBFF';
    ctx.beginPath(); ctx.moveTo(-24, 0); ctx.lineTo(-15, -6); ctx.lineTo(-15, 6); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(24, 0); ctx.lineTo(15, -6); ctx.lineTo(15, 6); ctx.closePath(); ctx.fill();
  } else if (o.kind === 'sc') {
    ctx.translate(x, y); ctx.rotate(t * 2); ctx.globalAlpha = o.used ? 0.45 : 1;
    ctx.strokeStyle = COL.gold; ctx.lineWidth = 4; ctx.lineCap = 'round';
    for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 7, Math.sin(a) * 7); ctx.lineTo(Math.cos(a) * 19, Math.sin(a) * 19); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(0, 0, 4, 0, 7); ctx.fillStyle = COL.gold; ctx.fill();
  }
  ctx.restore();
}

// Predict the aim path up to the first thing the ball would hit.
function predictAim(ang) {
  let x = G.launchX, y = FLOOR - R;
  const dx = Math.cos(ang), dy = -Math.sin(ang), step = 5;
  for (let i = 0; i < 400; i++) {
    x += dx * step; y += dy * step;
    if (x < FX0 + R || x > FX0 + FW - R || y < FY0 + R) return [clamp(x, FX0 + R, FX0 + FW - R), Math.max(y, FY0 + R)];
    const col = Math.floor((x - FX0) / CELL), row = Math.floor((y - FY0) / CELL);
    for (let r = row - 1; r <= row + 1; r++) {
      if (r < 0 || r >= ROWS) continue;
      for (let c = col - 1; c <= col + 1; c++) {
        if (c < 0 || c >= COLS) continue;
        const o = G.grid[r][c];
        if (o && o.k === 'brick' && collidePoly(x, y, R, o.v)) return [x, y];
      }
    }
  }
  return [x, y];
}

function aimAngleFrom(p) {
  const dx = p.x - G.launchX, dy = (FLOOR - R) - p.y;
  if (dy <= 4) return null;
  return Math.atan2(dy, dx);
}

function drawGame(dt) {
  const g = G;
  // field contents, clipped so the shifting row slides in under the top bar
  ctx.save();
  ctx.beginPath(); ctx.rect(FX0, FY0, FW, FH); ctx.clip();
  const yOff = -g.shift * CELL;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const o = g.grid[r][c];
    if (!o) continue;
    if (o.k === 'brick') {
      o.flash = Math.max(0, o.flash - dt * 6); o.pop = Math.max(0, o.pop - dt * 7);
      drawBrick(o, r, c, yOff);
      if (ui.bombMode) {
        const v = insetPoly(cellVerts(c, r, o.shape), 3);
        for (const p of v) p[1] += yOff;
        polyPath(v); ctx.lineWidth = 3; ctx.strokeStyle = `rgba(255,201,74,${0.5 + Math.sin(ui.t * 8) * 0.35})`; ctx.stroke();
      }
    } else drawPickup(o, r, c, yOff);
  }
  // laser beams
  for (let i = beams.length - 1; i >= 0; i--) {
    const b = beams[i]; b.t += dt;
    if (b.t > b.life) { beams.splice(i, 1); continue; }
    const a = 1 - b.t / b.life, [x, y] = cellCenter(b.r, b.c);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = `rgba(56,217,255,${a * 0.35})`;
    if (b.dir === 'h') ctx.fillRect(FX0, y - 16 * a - 4, FW, 32 * a + 8); else ctx.fillRect(x - 16 * a - 4, FY0, 32 * a + 8, FH);
    ctx.fillStyle = `rgba(230,252,255,${a})`;
    if (b.dir === 'h') ctx.fillRect(FX0, y - 3, FW, 6); else ctx.fillRect(x - 3, FY0, 6, FH);
    ctx.restore();
  }
  ctx.restore();

  // floor line
  ctx.fillStyle = 'rgba(155,164,245,0.5)'; ctx.fillRect(FX0, FLOOR, FW, 2);

  // balls and trails
  const sk = SKINS[SAVE.skin] || SKINS[0];
  const trailLen = sk.long ? 0.05 : 0.022;
  ctx.save(); ctx.lineCap = 'round';
  if (g.phase === 'fire') {
    ctx.lineWidth = R * 1.25;
    for (const b of g.balls) {
      if (b.state !== 'fly') continue;
      const tc = sk.trail || `hsl(${(ui.t * 240 + b.i * 30) % 360},100%,65%)`;
      ctx.strokeStyle = tc; ctx.globalAlpha = sk.long ? 0.35 : 0.2;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * trailLen, b.y - b.vy * trailLen); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    for (const b of g.balls) {
      if (b.state === 'done') continue;
      ctx.drawImage(ballSprite(SAVE.skin, b.i), b.x - SPR / 2, b.y - SPR / 2, SPR, SPR);
    }
  }
  ctx.restore();

  // launcher
  const lx = g.phase === 'fire' && g.firstX !== null ? g.firstX : g.launchX;
  const waiting = g.phase === 'aim';
  if (waiting || g.toFire > 0 || g.firstX !== null) {
    if (waiting) {
      const pr = R + 8 + Math.sin(ui.t * 5) * 3;
      ctx.beginPath(); ctx.arc(g.launchX, FLOOR - R, pr, 0, 7); ctx.strokeStyle = 'rgba(155,164,245,0.4)'; ctx.lineWidth = 2; ctx.stroke();
    }
    if (waiting || g.toFire > 0) ctx.drawImage(ballSprite(SAVE.skin, 0), g.launchX - SPR / 2, FLOOR - R - SPR / 2, SPR, SPR);
    if (g.phase === 'fire' && g.firstX !== null) ctx.drawImage(ballSprite(SAVE.skin, 0), lx - SPR / 2, FLOOR - R - SPR / 2, SPR, SPR);
    const n = waiting ? g.ballCount : g.toFire;
    if (n > 0) {
      const tx = clamp(g.launchX, FX0 + 40, FX0 + FW - 40);
      txt('x' + n, tx, FLOOR + 26, 22, COL.ink, 'center', FONT_U, 800);
    }
  }
  if (g.pending > 0 && g.phase === 'fire') txt('+' + g.pending, clamp(lx, FX0 + 40, FX0 + FW - 40), FLOOR + 26, 20, COL.mint, 'center', FONT_U, 800);

  // aim line
  if (ui.aim && waiting && !ui.overlay) {
    const ang = aimAngleFrom(ui.aim);
    const ok = ang !== null && canAim(ang);
    if (ang !== null) {
      const [hx, hy] = predictAim(ok ? ang : clamp(ang, 0.14, Math.PI - 0.14));
      const sx = g.launchX, sy = FLOOR - R, L = Math.hypot(hx - sx, hy - sy);
      const gap = 24, off = (ui.t * 90) % gap;
      ctx.fillStyle = ok ? 'rgba(255,255,255,0.9)' : 'rgba(255,90,122,0.6)';
      for (let d = gap - off + 10; d < L - 6; d += gap) {
        const k = d / L, rad = 5 - (d / L) * 2.2;
        ctx.beginPath(); ctx.arc(sx + (hx - sx) * k, sy + (hy - sy) * k, rad, 0, 7); ctx.fill();
      }
      ctx.beginPath(); ctx.arc(hx, hy, R, 0, 7); ctx.strokeStyle = ok ? 'rgba(255,255,255,0.75)' : 'rgba(255,90,122,0.6)'; ctx.lineWidth = 2.5; ctx.stroke();
    }
  }

  // effects
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    const a = Math.min(1, p.life / 0.4);
    ctx.fillStyle = rgb(p.col, a * 0.9);
    const s = p.size * (0.5 + a * 0.5);
    ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
  }
  for (let i = rings.length - 1; i >= 0; i--) {
    const q = rings[i]; q.t += dt;
    const life = q.big ? 0.5 : 0.32;
    if (q.t > life) { rings.splice(i, 1); continue; }
    const k = q.t / life;
    ctx.beginPath(); ctx.arc(q.x, q.y, (q.big ? 40 : 18) + k * (q.big ? 150 : 50), 0, 7);
    ctx.strokeStyle = rgb(q.col, (1 - k) * 0.8); ctx.lineWidth = 5 * (1 - k) + 1; ctx.stroke();
  }
  ctx.restore();
  for (let i = texts.length - 1; i >= 0; i--) {
    const f = texts[i]; f.t += dt;
    if (f.t > f.life) { texts.splice(i, 1); continue; }
    const a = 1 - f.t / f.life;
    ctx.globalAlpha = a;
    if (f.coin) coinIcon(f.x - 22, f.y - f.t * 70, 11);
    txt(f.text, f.x + (f.coin ? 8 : 0), f.y - f.t * 70, 28, f.col, 'center', FONT_U, 800);
    ctx.globalAlpha = 1;
  }

  // hint for the very first shot
  const firstTime = waiting && !ui.aim && ((g.mode === 'level' && g.level === 1 && g.shotsUsed === 0) || (g.mode === 'challenge' && g.turn === 1 && SAVE.best === 0));
  if (firstTime) {
    const a = 0.55 + Math.sin(ui.t * 4) * 0.35;
    ctx.globalAlpha = a; spaced('DRAG UP TO AIM, LET GO TO FIRE', W / 2, FLOOR - 130, 22, COL.ink, 2); ctx.globalAlpha = 1;
  }
  if (ui.bombMode) {
    rr(W / 2 - 200, FLOOR - 160, 400, 54, 27); ctx.fillStyle = 'rgba(10,12,36,0.88)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,201,74,0.6)'; ctx.lineWidth = 2; ctx.stroke();
    txt('Tap a brick to bomb it', W / 2, FLOOR - 132, 24, COL.gold, 'center', FONT_U, 700);
  }

  drawTopBar();
  drawBottomBar();
}

function drawTopBar() {
  const g = G;
  roundButton('pause', 62, 66, 34, () => ICON.pause(COL.ink), () => openOverlay('pause'));
  if (g.mode === 'level') {
    spaced('LEVEL', W / 2, 36, 16, COL.dim, 4);

  } else {

  }

    txt(`${left} shot${left === 1 ? '' : 's'} left`, W - 24 - 75, 102, 18, warn ? COL.danger : COL.accentHi, 'center', FONT_U, 700);

}

function drawBottomBar() {
  const g = G, y = 1196;
  const aim = g.phase === 'aim' && !ui.overlay;
  roundButton('bomb', 92, y, 40, () => ICON.bomb(COL.ink), () => {
    if (ui.bombMode) { ui.bombMode = false; return; }
    if (SAVE.inv.bomb <= 0) { openFree('bomb'); return; }
    ui.bombMode = true;
  }, { count: SAVE.inv.bomb, disabled: !aim, active: ui.bombMode });
  roundButton('double', 196, y, 40, () => ICON.double(g.dblArmed ? '#FFFFFF' : COL.ink), () => {
    if (g.dblArmed) return;

    SAVE.inv.double--; g.dblArmed = true; persist(); toast('Next shot deals double damage');
  }, { count: SAVE.inv.double, disabled: !aim, active: g.dblArmed });
  roundButton('row', 300, y, 40, () => ICON.row(COL.ink), () => {
    if (SAVE.inv.row <= 0) { openFree('row'); return; }
    if (clearLowestRow(g)) { SAVE.inv.row--; persist(); ui.shake = 8; checkInstantWin(); }
  }, { count: SAVE.inv.row, disabled: !!ui.overlay || g.cleared });

  if (g.phase === 'fire') {
    roundButton('recall', 540, y, 40, () => ICON.recall(COL.ink), () => recallAll(g));
    if (g.turnTime > CONFIG.FF_AFTER) {
      roundButton('ff', 644, y, 40, () => ICON.ff(g.ff ? '#FFFFFF' : COL.ink), () => { g.ff = !g.ff; }, { active: g.ff });
    }
  } else if (g.mode === 'level') {
    txt(`${g.ballCount} balls`, 592, y + 2, 22, COL.dim, 'center', FONT_U, 700);
  }
}

}

/* =====================================================================
   INPUT  (Pointer Events: one path for mouse and touch)
   ===================================================================== */
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function findHit(p) {
  for (let i = ui.hits.length - 1; i >= 0; i--) {
    const h = ui.hits[i];
    if (p.x >= h.x && p.x <= h.x + h.w && p.y >= h.y && p.y <= h.y + h.h) return h;
  }
  return null;
}

cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  audioInit();
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  if (ui.down && ui.down.id !== e.pointerId) return; // ignore a second finger
  const p = toLogical(e);
  ui.down = { id: e.pointerId, sx: p.x, sy: p.y, x: p.x, y: p.y, moved: false, scroll0: ui.screen === 'levels' ? ui.scroll.levels : ui.scroll.shop };
  const h = findHit(p);
  if (h && !h.disabled) { ui.press = h; return; }
  if (h && h.disabled) return;
  if (ui.fakeAd) return;
  if (ui.screen === 'game' && !ui.overlay && G && G.phase === 'aim' && !G.result) {
    if (ui.bombMode) return;
    ui.aim = p;
  }
});
cv.addEventListener('pointermove', (e) => {
  if (!ui.down || ui.down.id !== e.pointerId) return;
  e.preventDefault();
  const p = toLogical(e);
  ui.down.x = p.x; ui.down.y = p.y;
  const dist = Math.hypot(p.x - ui.down.sx, p.y - ui.down.sy);
  if (dist > 14) ui.down.moved = true;
  if ((ui.screen === 'levels' || ui.screen === 'shop') && !ui.overlay && ui.down.moved) {
    ui.press = null;
    ui.scroll[ui.screen] = ui.down.scroll0 - (p.y - ui.down.sy);
  }
  if (ui.aim) ui.aim = p;
});
function endPointer(e, cancelled) {
  if (!ui.down || ui.down.id !== e.pointerId) return;
  const p = toLogical(e);
  const d = ui.down; ui.down = null;
  if (ui.press) {
    const h = ui.press; ui.press = null;
    if (!cancelled && p.x >= h.x - 10 && p.x <= h.x + h.w + 10 && p.y >= h.y - 10 && p.y <= h.y + h.h + 10) {
      if (h.sound) sfx('click');
      h.fn();
    }
    return;
  }
  if (ui.screen === 'game' && G && !ui.overlay && !ui.fakeAd) {
    if (ui.bombMode && !cancelled && !d.moved) {
      const c = Math.floor((p.x - FX0) / CELL), r = Math.floor((p.y - FY0) / CELL);
      if (r >= 0 && r < ROWS && c >= 0 && c < COLS && G.grid[r][c] && G.grid[r][c].k === 'brick') {
        if (bombAt(G, r, c)) { SAVE.inv.bomb--; persist(); }
        ui.bombMode = false; checkInstantWin();
      } else if (p.y < FLOOR) ui.bombMode = false;
      return;
    }
    if (ui.aim) {
      ui.aim = null;
      if (cancelled || G.phase !== 'aim' || G.result) return;
      const ang = aimAngleFrom(p);
      if (ang !== null && canAim(ang)) { fire(G, ang); sfx('fire'); }
    }
  }
}
cv.addEventListener('pointerup', (e) => endPointer(e, false));
cv.addEventListener('pointercancel', (e) => endPointer(e, true));
cv.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('gesturestart', (e) => e.preventDefault());
cv.addEventListener('wheel', (e) => {
  if (ui.screen === 'levels' || ui.screen === 'shop') { ui.scroll[ui.screen] += e.deltaY; e.preventDefault(); }
}, { passive: false });
window.addEventListener('keydown', (e) => {
  if (ui.screen !== 'game' || !G || ui.fakeAd) return;
  if (e.key === 'Escape' || e.key === 'p') { if (ui.overlay === 'pause') closeOverlay(); else if (!ui.overlay) openOverlay('pause'); }
  if (e.key === ' ' && G.phase === 'fire' && G.turnTime > CONFIG.FF_AFTER) { G.ff = !G.ff; e.preventDefault(); }
});
// Android back button (only exists inside the Capacitor app): step back a screen
// or pause, instead of closing the app mid-game.
try {
  const CE = window.capacitorExports;
  if (CE && CE.Capacitor && CE.Capacitor.isNativePlatform()) {
    const CapApp = CE.registerPlugin('App');
    CapApp.addListener('backButton', () => {
      if (ui.fakeAd || ui.adBusy) return;
      if (ui.overlay === 'pause' || ui.overlay === 'confirmReset' || ui.overlay === 'freePower') closeOverlay();
      else if (ui.screen === 'game') { if (!ui.overlay) openOverlay('pause'); else goto(G && G.mode === 'level' ? 'levels' : 'title'); }
      else if (ui.screen === 'title') CapApp.exitApp();
      else goto('title');
    });
  }
} catch (e) {}
document.addEventListener('visibilitychange', () => {
  if (document.hidden && ui.screen === 'game' && !ui.overlay && !ui.adBusy && G && !G.result) openOverlay('pause');
});

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  ui.t += dt; ui.ovT += dt;
  if (ui.toast) { ui.toast.t -= dt; if (ui.toast.t <= 0) ui.toast = null; }

  // simulation (fixed timestep)
  if (ui.screen === 'game' && G && !ui.overlay && !ui.fakeAd) {
    G.shift = Math.max(0, G.shift - dt / 0.22);
    if (G.phase === 'fire') {
      acc += dt * (G.ff ? CONFIG.FF_MULT : 1);
      let steps = 0;
      while (acc >= CONFIG.STEP && steps < CONFIG.MAX_STEPS_PER_FRAME) { updateTurn(G, CONFIG.STEP); acc -= CONFIG.STEP; steps++; }
      if (steps >= CONFIG.MAX_STEPS_PER_FRAME) acc = 0;
    } else acc = 0;
  }

  // draw
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.drawImage(bgCanvas, 0, 0, W, H);
  ui.hits.length = 0;
  ui.shake = Math.max(0, ui.shake - dt * 30);
  ctx.save();
  if (ui.shake > 0.3 && ui.screen === 'game') ctx.translate((Math.random() - 0.5) * ui.shake, (Math.random() - 0.5) * ui.shake);
  if (ui.screen === 'title') drawTitle(dt);
  else if (ui.screen === 'levels') drawLevels();
  else if (ui.screen === 'shop') drawShop();
  else if (ui.screen === 'settings') drawSettings();
  else if (ui.screen === 'game' && G) drawGame(ui.overlay ? 0 : dt);
  ctx.restore();
  if (ui.overlay) drawOverlay();
  Ads.setBanner(MONEY.BANNER_SCREENS.includes(ui.screen) && !ui.overlay && !ui.fakeAd);
  if (Ads.bannerWanted && !Ads.native) {
    // browser preview of where the banner sits in the app
    ctx.fillStyle = '#05060F'; ctx.fillRect(0, H - 110, W, 110);
    ctx.setLineDash([8, 8]); ctx.strokeStyle = 'rgba(255,201,74,0.6)'; ctx.lineWidth = 2; ctx.strokeRect(24, H - 98, W - 48, 86); ctx.setLineDash([]);
    txt('TEST BANNER AD', W / 2, H - 55, 22, COL.gold, 'center', FONT_U, 800);
  }
  if (ui.fakeAd) drawFakeAd(dt);
  if (ui.toast) {
    const a = Math.min(1, ui.toast.t / 0.3);
    ctx.globalAlpha = a;
    ctx.font = `700 22px ${FONT_U}`;
    const w = Math.min(W - 60, ctx.measureText(ui.toast.text).width + 60);
    rr((W - w) / 2, H - 300, w, 56, 28); ctx.fillStyle = 'rgba(8,10,30,0.92)'; ctx.fill();
    ctx.strokeStyle = 'rgba(155,164,245,0.4)'; ctx.lineWidth = 2; ctx.stroke();
    txt(ui.toast.text, W / 2, H - 271, 22, COL.ink, 'center', FONT_U, 700);
    ctx.globalAlpha = 1;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if (document.fonts && document.fonts.load) { document.fonts.load(`400 40px ${FONT_D}`).catch(() => {}); document.fonts.load(`800 30px ${FONT_U}`).catch(() => {}); }

// test hook (harmless in production)
window.__ricoshot = { get G() { return G; }, ui, SAVE: () => SAVE, startLevel, startChallenge, goto, fire: (a) => G && fire(G, a) };
})();
</script>
